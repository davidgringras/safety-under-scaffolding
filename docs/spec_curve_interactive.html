const MSL=R.ms,BSL=R.bs,SCL=R.sc;
const CN=['react','multi_agent','map_reduce'];
const CL={'react':'ReAct','multi_agent':'Multi-Agent','map_reduce':'Map-Reduce'};
const CC={'react':'#4488ff','multi_agent':'#44cc88','map_reduce':'#ff6644'};
const CA={'react':.9,'multi_agent':.9,'map_reduce':.9};
const CDa={'react':.2,'multi_agent':.2,'map_reduce':.2};

function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];}
const CRgb={};for(const k in CC)CRgb[k]=hexToRgb(CC[k]);

const allS=R.data.map(d=>({
  id:d[0],c:CN[d[1]],msi:d[2],bsi:d[3],sci:d[4],
  ms:MSL[d[2]],bs:BSL[d[3]],sc:SCL[d[4]],
  nm:d[5],nb:d[6],n:d[7],
  rd:d[8],rl:d[9],rh:d[10],
  or:d[11],ol:d[12],oh:d[13],
  nlp:d[14],sig:d[15]===1,pre:d[16]===1
}));

let AC=new Set(CN),met='or',srt='effect';
const dpr=Math.min(window.devicePixelRatio||1,2);

function gw(){return Math.min(1340,window.innerWidth-56)}

function stats(){
  const b=document.getElementById('sbar');let h='';
  for(const c of CN){
    if(!AC.has(c))continue;
    const cs=allS.filter(s=>s.c===c);
    const ns=cs.filter(s=>s.sig).length;
    const pct=(ns/cs.length*100).toFixed(1);
    const vals=cs.map(s=>met==='or'?s.or:s.rd).sort((a,b)=>a-b);
    const med=vals[Math.floor(vals.length/2)];
    h+=`<div class="sc ${c}"><div class="sl">${CL[c]}</div><div class="sv">${pct}%</div><div class="sd">significant (${ns}/${cs.length})</div></div>`;
    h+=`<div class="sc ${c}"><div class="sl">${CL[c]} median</div><div class="sv">${met==='or'?'OR '+med.toFixed(3):med.toFixed(1)+'pp'}</div><div class="sd">${met==='or'?'odds ratio':'risk diff'}</div></div>`;
  }
  b.innerHTML=h;
}

function getSorted(){
  let sp=allS.filter(s=>AC.has(s.c));
  if(srt==='effect') sp.sort((a,b)=>met==='or'?a.or-b.or:a.rd-b.rd);
  else{
    const co={map_reduce:0,react:1,multi_agent:2};
    sp.sort((a,b)=>{const d=co[a.c]-co[b.c];return d?d:(met==='or'?a.or-b.or:a.rd-b.rd);});
  }
  return sp;
}

const M={t:30,r:24,b:28,l:60};
const TH=310;
let cur=[];

function setupCanvas(id,w,h){
  const c=document.getElementById(id);
  c.style.width=w+'px';c.style.height=h+'px';
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return ctx;
}

function drawTop(sp,hlIdx){
  cur=sp;
  const W=gw(),iW=W-M.l-M.r,iH=TH-M.t-M.b;
  const ctx=setupCanvas('tc',W,TH);
  const n=sp.length;if(!n)return;

  const xS=i=>M.l+i/(n-1)*iW;
  let yMin,yMax,ref;
  if(met==='or'){
    yMin=Math.max(.02,Math.min(...sp.map(s=>s.ol))*.85);
    yMax=Math.min(8,Math.max(...sp.map(s=>s.oh))*1.15);
    ref=1;
  }else{
    yMin=Math.min(...sp.map(s=>s.rl))*1.1;
    yMax=Math.max(5,Math.max(...sp.map(s=>s.rh))*1.1);
    ref=0;
  }
  const yS=met==='or'
    ?v=>{v=Math.max(yMin,Math.min(yMax,v));return M.t+iH*(Math.log(yMax)-Math.log(v))/(Math.log(yMax)-Math.log(yMin))}
    :v=>M.t+iH*(yMax-v)/(yMax-yMin);

  // Grid
  const tks=met==='or'
    ?[.03,.05,.1,.2,.5,1,2,4].filter(v=>v>=yMin&&v<=yMax)
    :d3.ticks(yMin,yMax,8);
  ctx.strokeStyle='#13132a';ctx.lineWidth=1;
  for(const t of tks){ctx.beginPath();ctx.moveTo(M.l,yS(t));ctx.lineTo(M.l+iW,yS(t));ctx.stroke();}

  // Ref line
  ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(M.l,yS(ref));ctx.lineTo(M.l+iW,yS(ref));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#444';ctx.font='9px Inter,sans-serif';ctx.textAlign='right';
  ctx.fillText(met==='or'?'no effect (OR=1)':'no effect (RD=0)',M.l+iW-4,yS(ref)-5);

  // Danger zone shading for map-reduce region below ref
  if(met==='or'){
    const grd=ctx.createLinearGradient(0,yS(ref),0,yS(yMin));
    grd.addColorStop(0,'rgba(255,50,30,0)');
    grd.addColorStop(1,'rgba(255,50,30,.04)');
    ctx.fillStyle=grd;
    ctx.fillRect(M.l,yS(ref),iW,yS(yMin)-yS(ref));
  }

  // CI lines
  for(let i=0;i<n;i++){
    if(hlIdx>=0&&i!==hlIdx)continue;
    const s=sp[i];
    const lo=met==='or'?Math.max(yMin,s.ol):s.rl;
    const hi=met==='or'?Math.min(yMax,s.oh):s.rh;
    const rgb=CRgb[s.c];
    ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${s.sig?.12:.06})`;
    ctx.lineWidth=hlIdx===i?2:.5;
    ctx.beginPath();ctx.moveTo(xS(i),yS(lo));ctx.lineTo(xS(i),yS(hi));ctx.stroke();
  }

  // Points
  for(let i=0;i<n;i++){
    const s=sp[i];
    const x=xS(i),v=met==='or'?s.or:s.rd,y=yS(v);
    const rgb=CRgb[s.c];
    const a=s.sig?CA[s.c]:CDa[s.c];
    const r=s.pre?5:(hlIdx===i?5:1.6);

    if(hlIdx>=0&&i!==hlIdx&&!s.pre){
      // Dim non-highlighted
      ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},.08)`;
      ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();
      continue;
    }

    ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();

    if(s.pre){
      ctx.strokeStyle='#ffcc00';ctx.lineWidth=2.5;ctx.stroke();
    }
    if(hlIdx===i){
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      // Glow
      ctx.shadowColor=CC[s.c];ctx.shadowBlur=12;
      ctx.fillStyle=CC[s.c];ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  // Pre-reg labels
  const prs=sp.map((s,i)=>({s,i})).filter(({s})=>s.pre);
  ctx.font='bold 9px Inter,sans-serif';ctx.textAlign='center';
  const lps=[];
  for(const{s,i}of prs){
    const x=xS(i),v=met==='or'?s.or:s.rd;
    let ly=yS(v)-16;
    for(const lp of lps){if(Math.abs(x-lp.x)<70&&Math.abs(ly-lp.y)<14)ly=lp.y-14;}
    lps.push({x,y:ly});
    // Connector
    ctx.strokeStyle='rgba(255,204,0,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,ly+5);ctx.lineTo(x,yS(v)-6);ctx.stroke();
    ctx.fillStyle='#ffcc00';
    ctx.fillText(CL[s.c],x,ly);
    ctx.font='8px Inter,sans-serif';
    ctx.fillStyle='rgba(255,204,0,.6)';
    ctx.fillText('pre-registered',x,ly+10);
    ctx.font='bold 9px Inter,sans-serif';
  }

  // Median lines
  for(const cfg of CN){
    if(!AC.has(cfg))continue;
    const ci=sp.map((s,i)=>({s,i})).filter(({s})=>s.c===cfg);
    if(!ci.length)continue;
    const vals=ci.map(({s})=>met==='or'?s.or:s.rd).sort((a,b)=>a-b);
    const medV=vals[Math.floor(vals.length/2)];
    const xs=ci.map(({i})=>i);
    ctx.strokeStyle=CC[cfg];ctx.lineWidth=1;ctx.globalAlpha=.3;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(xS(Math.min(...xs))-2,yS(medV));ctx.lineTo(xS(Math.max(...xs))+2,yS(medV));ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }

  // Hover line
  if(hlIdx>=0){
    ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(xS(hlIdx),M.t);ctx.lineTo(xS(hlIdx),M.t+iH);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Y axis
  ctx.fillStyle='#555';ctx.font='10px Inter,sans-serif';ctx.textAlign='right';
  for(const t of tks){
    const lbl=met==='or'?(t<.1?t.toFixed(2):t.toFixed(1)):t.toFixed(0)+'pp';
    ctx.fillText(lbl,M.l-8,yS(t)+3);
  }
  ctx.strokeStyle='#222';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(M.l,M.t);ctx.lineTo(M.l,M.t+iH);ctx.stroke();

  // Y label
  ctx.save();ctx.translate(12,M.t+iH/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#555';ctx.font='10px Inter,sans-serif';ctx.textAlign='center';
  ctx.fillText(met==='or'?'Odds Ratio (log scale)':'Risk Difference (pp)',0,0);
  ctx.restore();

  // Title
  document.getElementById('tct').textContent=
    (met==='or'?'Odds Ratio':'Risk Difference')+' by Specification (sorted by '+(srt==='effect'?'effect size':'scaffold type')+')';
}

// Bottom chart
const BM={t:6,r:24,b:6,l:120};
const rH=9;
let botH=0;
let rowMap={models:{},benchmarks:{},scoring:{}};

function drawBot(sp,hlIdx){
  const W=gw(),iW=W-BM.l-BM.r;
  const n=sp.length;if(!n)return;

  const groups=[{k:'models',l:'MODELS',items:MSL},{k:'benchmarks',l:'BENCHMARKS',items:BSL},{k:'scoring',l:'SCORING',items:SCL}];
  let y=BM.t;
  const rows=[];
  rowMap={models:{},benchmarks:{},scoring:{}};

  for(const g of groups){
    rows.push({type:'hdr',l:g.l,y});y+=rH+5;
    for(const item of g.items){
      rowMap[g.k][item]=y;
      rows.push({type:'row',l:item,y});
      y+=rH+1;
    }
    y+=3;
  }
  botH=y+BM.b;

  const ctx=setupCanvas('bc',W,botH);

  // Labels
  for(const r of rows){
    if(r.type==='hdr'){
      ctx.fillStyle='#444';ctx.font='bold 9px Inter,sans-serif';ctx.textAlign='left';
      ctx.fillText(r.l,6,r.y+rH-1);
    }else{
      let lbl=r.l;if(lbl.length>22)lbl=lbl.slice(0,20)+'..';
      ctx.fillStyle='#444';ctx.font='8px Inter,sans-serif';ctx.textAlign='right';
      ctx.fillText(lbl,BM.l-8,r.y+rH-2);
    }
  }

  // Separator
  ctx.strokeStyle='#1a1a33';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(BM.l,BM.t);ctx.lineTo(BM.l,y);ctx.stroke();

  const xS=i=>BM.l+i/(n-1)*iW;
  const dw=Math.max(.8,iW/n*.75);

  // Draw matrix dots
  for(let i=0;i<n;i++){
    const s=sp[i];const x=xS(i);
    const rgb=CRgb[s.c];
    const isDim=hlIdx>=0&&i!==hlIdx;
    const a=isDim?.04:(s.sig?.7:.15);

    ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

    const my=rowMap.models[s.ms];
    if(my!==undefined)ctx.fillRect(x-dw/2,my,dw,rH-1);
    const by=rowMap.benchmarks[s.bs];
    if(by!==undefined)ctx.fillRect(x-dw/2,by,dw,rH-1);
    const sy=rowMap.scoring[s.sc];
    if(sy!==undefined)ctx.fillRect(x-dw/2,sy,dw,rH-1);
  }

  // Highlight column
  if(hlIdx>=0&&hlIdx<n){
    const s=sp[hlIdx];const x=xS(hlIdx);
    const rgb=CRgb[s.c];
    ctx.fillStyle=CC[s.c];
    const hw=Math.max(2,dw+1);
    const my=rowMap.models[s.ms];
    if(my!==undefined){ctx.fillRect(x-hw/2,my-1,hw,rH+1);}
    const by=rowMap.benchmarks[s.bs];
    if(by!==undefined){ctx.fillRect(x-hw/2,by-1,hw,rH+1);}
    const sy=rowMap.scoring[s.sc];
    if(sy!==undefined){ctx.fillRect(x-hw/2,sy-1,hw,rH+1);}

    // Hover line
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,BM.t);ctx.lineTo(x,y);ctx.stroke();
  }
}

function showTip(e,s){
  const tt=document.getElementById('tip');
  const sig=s.sig?'<span style="color:#ff6644;font-weight:700">Significant (p&lt;0.05)</span>':'<span style="color:#44cc88;font-weight:700">Not significant</span>';
  const pStr=s.nlp>100?'&lt;10<sup>-100</sup>':s.nlp>10?'&lt;10<sup>-10</sup>':'~10<sup>-'+s.nlp.toFixed(1)+'</sup>';
  tt.innerHTML=`
    <div class="th" style="color:${CC[s.c]}">${CL[s.c]}${s.pre?' <span style="color:#ffcc00">&#9733; Pre-registered</span>':''}</div>
    <div class="tr"><span class="tl">Models</span><span class="tv">${s.ms}</span></div>
    <div class="tr"><span class="tl">Benchmarks</span><span class="tv">${s.bs}</span></div>
    <div class="tr"><span class="tl">Scoring</span><span class="tv">${s.sc}</span></div>
    <div class="tr"><span class="tl">N</span><span class="tv">${s.n.toLocaleString()}</span></div>
    <hr>
    <div class="tr"><span class="tl">Odds Ratio</span><span class="tv">${s.or.toFixed(3)} [${s.ol.toFixed(3)}, ${s.oh.toFixed(3)}]</span></div>
    <div class="tr"><span class="tl">Risk Diff</span><span class="tv">${s.rd.toFixed(1)}pp [${s.rl.toFixed(1)}, ${s.rh.toFixed(1)}]</span></div>
    <div class="tr"><span class="tl">p-value</span><span class="tv">${pStr}</span></div>
    <div style="margin-top:3px">${sig}</div>`;
  tt.style.display='block';
  let tx=e.clientX+14,ty=e.clientY-8;
  if(tx+310>window.innerWidth)tx=e.clientX-320;
  if(ty+240>window.innerHeight)ty=e.clientY-240;
  tt.style.left=tx+'px';tt.style.top=ty+'px';
}

// Hover
let hlIdx=-1;
function setupHover(){
  const c=document.getElementById('tc');
  const getIdx=e=>{
    const rect=c.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const W=gw(),iW=W-M.l-M.r;
    if(my<M.t||my>TH-M.b||mx<M.l||mx>M.l+iW)return-1;
    return Math.round((mx-M.l)/iW*(cur.length-1));
  };
  c.addEventListener('mousemove',e=>{
    const idx=getIdx(e);
    if(idx<0||idx>=cur.length){hlIdx=-1;drawTop(cur,-1);drawBot(cur,-1);document.getElementById('tip').style.display='none';return;}
    if(idx===hlIdx)return;
    hlIdx=idx;
    drawTop(cur,idx);
    drawBot(cur,idx);
    showTip(e,cur[idx]);
  });
  c.addEventListener('mouseleave',()=>{
    hlIdx=-1;drawTop(cur,-1);drawBot(cur,-1);
    document.getElementById('tip').style.display='none';
  });
}

function tc(c){
  if(AC.has(c)){if(AC.size<=1)return;AC.delete(c);}else AC.add(c);
  document.querySelector(`.sb.${c}`).classList.toggle('on');
  redraw();
}
function sm(m){met=m;document.getElementById('bor').classList.toggle('on',m==='or');document.getElementById('brd').classList.toggle('on',m==='rd');redraw();}
function ss(s){srt=s;document.getElementById('bse').classList.toggle('on',s==='effect');document.getElementById('bsc').classList.toggle('on',s==='config');redraw();}

function redraw(){
  hlIdx=-1;
  const sp=getSorted();
  stats();
  drawTop(sp,-1);
  drawBot(sp,-1);
}

setupHover();
redraw();
window.addEventListener('resize',()=>redraw());
</script>
</body>
