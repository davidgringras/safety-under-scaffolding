// ===========================================
// COLOR
// ===========================================
function safetyColor(rate) {
  // Red-Yellow-Green gradient
  let r, g, b;
  if (rate < 0.5) {
    const t = rate / 0.5;
    r = 0.85;
    g = 0.15 + 0.7 * t;
    b = 0.1;
  } else {
    const t = (rate - 0.5) / 0.5;
    r = 0.85 - 0.65 * t;
    g = 0.85 - 0.1 * t;
    b = 0.1 + 0.2 * t;
  }
  return new THREE.Color(r, g, b);
}

// Emissive glow intensity based on rate
function emissiveIntensity(rate) {
  return 0.15 + 0.35 * rate;
}

    color: benchColors[bi],

  for (let mi = 0; mi < 6; mi++) {

      new THREE.Vector3(mi * modelSpacing, bi * benchSpacing, -0.5),

// DATA BARS AND SPHERES

const barGroup = new THREE.Group();

const sphereGroup = new THREE.Group();

let currentMode = 'bars'; // 'bars' or 'spheres'
const cellMeshes = [];  // store references to each cell's mesh(es)
const cellData = [];    // parallel array of data

function createBars() {
  barGroup.clear();
  cellMeshes.length = 0;
  cellData.length = 0;

  DATA.forEach((d, idx) => {
    const x = d.mi * modelSpacing;
    const y = d.bi * benchSpacing;
    const z = d.ci * configSpacing;
    const height = Math.max(d.safe_rate * 2.2, 0.08); // min height

    const geo = new THREE.BoxGeometry(0.55, height, 0.55);
    geo.translate(0, height / 2, 0);

    const color = safetyColor(d.safe_rate);
    const mat = new THREE.MeshStandardMaterial({
      color: color,
      metalness: 0.3,
      roughness: 0.4,
      emissive: color,
      emissiveIntensity: emissiveIntensity(d.safe_rate) * 0.4,
      transparent: true,
      opacity: 0.92,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { idx, data: d };

    barGroup.add(mesh);
    cellMeshes.push(mesh);
    cellData.push(d);
  });
}

function createSpheres() {
  sphereGroup.clear();

  DATA.forEach((d, idx) => {
    const x = d.mi * modelSpacing;
    const y = d.bi * benchSpacing + 1.0;
    const z = d.ci * configSpacing;
    const radius = 0.25 + d.safe_rate * 0.55;

    const geo = new THREE.SphereGeometry(radius, 24, 24);
    const color = safetyColor(d.safe_rate);
    const mat = new THREE.MeshStandardMaterial({
      color: color,
      metalness: 0.5,
      roughness: 0.2,
      emissive: color,
      emissiveIntensity: emissiveIntensity(d.safe_rate) * 0.5,
      transparent: true,
      opacity: 0.9,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.userData = { idx, data: d };

    sphereGroup.add(mesh);
  });
}

createBars();
sphereGroup.visible = false;

function makeTextSprite(text, opts = {}) {
  const fontSize = opts.fontSize || 28;
  const fontWeight = opts.fontWeight || '600';
  const color = opts.color || '#aabbcc';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `${fontWeight} ${fontSize}px Inter, Segoe UI, sans-serif`;
  const metrics = ctx.measureText(text);
  const width = metrics.width + 20;
  canvas.width = width;
  canvas.height = fontSize * 1.5;
  ctx.font = `${fontWeight} ${fontSize}px Inter, Segoe UI, sans-serif`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 10, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false,
  });
  const sprite = new THREE.Sprite(spriteMat);
  const scale = opts.scale || 0.12;
  sprite.scale.set(width * scale / fontSize, canvas.height * scale / fontSize, 1);
  return sprite;
}

// RAYCASTING / HOVER
// ===========================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;
const tooltip = document.getElementById('tooltip');

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  const group = currentMode === 'bars' ? barGroup : sphereGroup;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(group.children, false);

  // Reset previous hover
  if (hoveredMesh && hoveredMesh.material) {
    hoveredMesh.material.emissiveIntensity = hoveredMesh.userData._origEmissive || 0.1;
    hoveredMesh.scale.set(1, 1, 1);
  }

  if (intersects.length > 0) {
    const mesh = intersects[0].object;
    const d = mesh.userData.data;
    if (d) {
      hoveredMesh = mesh;
      mesh.userData._origEmissive = emissiveIntensity(d.safe_rate) * (currentMode === 'bars' ? 0.4 : 0.5);
      mesh.material.emissiveIntensity = 0.8;
      mesh.scale.set(1.08, 1.08, 1.08);

      // Update tooltip
      tooltip.style.display = 'block';
      tooltip.style.left = (event.clientX + 16) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';

      // Keep tooltip in viewport
      const rect = tooltip.getBoundingClientRect();
      if (rect.right > window.innerWidth - 10) {
        tooltip.style.left = (event.clientX - rect.width - 16) + 'px';
      }
      if (rect.bottom > window.innerHeight - 10) {
        tooltip.style.top = (event.clientY - rect.height - 10) + 'px';
      }

      tooltip.querySelector('.tt-model').textContent = d.model_name;
      tooltip.querySelector('.tt-config').textContent = d.config_name;
      tooltip.querySelector('.tt-bench').textContent = d.benchmark_name;
      tooltip.querySelector('.tt-n').textContent = d.n.toLocaleString();

      const rateEl = tooltip.querySelector('.tt-rate');
      rateEl.textContent = (d.safe_rate * 100).toFixed(1) + '%';
      const c = safetyColor(d.safe_rate);
      rateEl.style.color = `rgb(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)})`;
    }
  } else {
    tooltip.style.display = 'none';
    hoveredMesh = null;
  }
}

renderer.domElement.addEventListener('mousemove', onMouseMove);

// ===========================================
// FILTERS
// ===========================================
function applyFilters() {
  const benchFilter = document.getElementById('filter-benchmark').value;
  const configFilter = document.getElementById('filter-config').value;
  const modelFilter = document.getElementById('filter-model').value;

  const group = currentMode === 'bars' ? barGroup : sphereGroup;
  group.children.forEach(mesh => {
    const d = mesh.userData.data;
    if (!d) return;
    let visible = true;
    if (benchFilter !== 'all' && d.bi !== parseInt(benchFilter)) visible = false;
    if (configFilter !== 'all' && d.ci !== parseInt(configFilter)) visible = false;
    if (modelFilter !== 'all' && d.mi !== parseInt(modelFilter)) visible = false;

    // Animate opacity
    if (visible) {
      mesh.visible = true;
      mesh.material.opacity = currentMode === 'bars' ? 0.92 : 0.9;
    } else {
      mesh.material.opacity = 0.05;
      // Don't hide completely so grid context remains
    }
  });
}

document.getElementById('filter-benchmark').addEventListener('change', applyFilters);
document.getElementById('filter-config').addEventListener('change', applyFilters);
document.getElementById('filter-model').addEventListener('change', applyFilters);

// ===========================================
// CONTROLS (exposed globally via window)
// ===========================================
window.resetCamera = function() {
  controls.target.set(5, 4, 3);
  camera.position.set(18, 14, 22);
  controls.update();
};

window.toggleAutoRotate = function() {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btn-rotate').textContent =
    'Auto-Rotate: ' + (controls.autoRotate ? 'ON' : 'OFF');
  document.getElementById('btn-rotate').classList.toggle('active', controls.autoRotate);
};

window.viewFront = function() {
  camera.position.set(5, 7, 25);
  controls.target.set(5, 5, 3);
  controls.update();
};

window.viewTop = function() {
  camera.position.set(5, 30, 3);
  controls.target.set(5, 0, 3);
  controls.update();
};

window.viewSide = function() {
  camera.position.set(25, 8, 3);
  controls.target.set(5, 5, 3);
  controls.update();
};

window.toggleMode = function() {
  if (currentMode === 'bars') {
    currentMode = 'spheres';
    barGroup.visible = false;
    if (sphereGroup.children.length === 0) createSpheres();
    sphereGroup.visible = true;
    document.getElementById('btn-mode').textContent = 'Mode: Spheres';
  } else {
    currentMode = 'bars';
    sphereGroup.visible = false;
    barGroup.visible = true;
    document.getElementById('btn-mode').textContent = 'Mode: Bars';
  }
  applyFilters();
};

// ===========================================
// LEGEND BAR
// ===========================================
(function drawLegend() {
  const canvas = document.getElementById('legend-bar');
  const ctx = canvas.getContext('2d');
  const h = canvas.height;
  for (let y = 0; y < h; y++) {
    const rate = 1.0 - y / h;
    const c = safetyColor(rate);
    ctx.fillStyle = `rgb(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)})`;
    ctx.fillRect(0, y, canvas.width, 1);
  }
})();

// ===========================================
// PARTICLE BACKGROUND
// ===========================================
const particleCount = 300;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 80;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.08,
  color: 0x4444aa,
  transparent: true,
  opacity: 0.3,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ===========================================
// ANIMATION LOOP
// ===========================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.update();

  // Gentle particle drift
  particles.rotation.y = t * 0.01;
  particles.rotation.x = Math.sin(t * 0.005) * 0.02;

  // Subtle bar pulse on hovered
  if (hoveredMesh) {
    const pulse = 1.0 + Math.sin(t * 4) * 0.03;
    hoveredMesh.scale.set(pulse * 1.05, pulse * 1.05, pulse * 1.05);
  }

  renderer.render(scene, camera);
}

animate();

// ===========================================
// RESIZE
// ===========================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Set initial active state
document.getElementById('btn-rotate').classList.add('active');

</script>
</body>
